services:
  severinus:
    container_name: severinus
    image: postgres:16
    # 5432-5434 são usadas por instalações nativas do PostgreSQL nesta máquina.
    ports:
      - 5435:5432
    environment:
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
      - POSTGRES_DB=pg_severinus
    volumes:
      - severinus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d pg_severinus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  severinus_pgdata: