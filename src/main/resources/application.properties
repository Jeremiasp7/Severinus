server.port=8085

# ---------------------------------------------------------------------------
# Banco de dados
# Credenciais vêm do ambiente. Os defaults servem apenas para desenvolvimento
# local e nunca devem ser usados em outro ambiente.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/pg_severinus}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=validate: o schema é criado e evoluído exclusivamente pelo Flyway.
# Não alterar para update/create — ver docs/PLANO.md.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Flyway
# Sem baseline: o banco é criado do zero a partir de V1__init.sql.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# Upload de arquivos
# ---------------------------------------------------------------------------
file.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---------------------------------------------------------------------------
# Autenticação (JWT) — implementado na Fase 3
# JWT_SECRET é obrigatório: mínimo de 32 bytes para HMAC-SHA256.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration=900
app.jwt.refresh-token-expiration=2592000

# ---------------------------------------------------------------------------
# CORS — implementado na Fase 3
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------------
# Documentação OpenAPI / Swagger
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
